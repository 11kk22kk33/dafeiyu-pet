<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><title>小宠物 · 情绪</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--line:#e6e9ef;--text:#101620;--dim:#68717f;--faint:#9aa3b1;
--brand:#3d5aa8;--brand-soft:#eef2fb;--green:#0b7a54;--amber:#8f5c05;--red:#c92b41;--r:10px;
--surface-2:#f8f9fb;--text-2:#454f5e;--line-2:#f1f3f7}
html[data-theme="dark"]{--bg:#0f1419;--surface:#182028;--surface-2:#141c24;--line:#26333f;--line-2:#31404e;--text:#e6edf3;--text-2:#c2cdd8;--dim:#8b9aa8;--faint:#6b7885;--brand:#7aa5e8;--brand-soft:#182236;--green:#3fd6a8;--amber:#ffb454;--red:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
header b{font-weight:500;font-size:16px}
header .st{margin-left:auto;font-size:12px;color:var(--dim)}
main{max-width:1180px;margin:0 auto;padding:24px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h2{font-size:13px;font-weight:500;color:var(--dim);margin:0 0 12px}
.wide{grid-column:1 / -1}
canvas{width:100%;height:300px;display:block}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:52px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.bar.g i{background:var(--green)}.bar.a i{background:var(--amber)}.bar.r i{background:var(--red)}
.num{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.axis{position:relative;height:26px;margin:6px 0 2px}
.axis .track{position:absolute;left:0;right:0;top:11px;height:4px;background:var(--line);border-radius:99px}
.axis .mk{position:absolute;top:4px;width:10px;height:18px;margin-left:-5px;background:var(--brand);border-radius:4px;transition:left .4s}
.axis .lb{position:absolute;top:26px;font-size:11px;color:var(--faint)}
.axis .lb.l{left:0}.axis .lb.c{left:50%;transform:translateX(-50%)}.axis .lb.r{right:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:12px}
td.k{color:var(--dim)}
pre{margin:0;white-space:pre-wrap;font:13px/1.7 "Microsoft YaHei",monospace;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}
.empty{color:var(--faint);font-size:13px}
body.embed{background:transparent}
body.embed header{background:transparent;border-bottom:0;height:auto;padding:0 0 10px}
body.embed main{max-width:none;padding:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--brand-soft);color:var(--brand)}
.now-wrap{display:flex;gap:20px;align-items:stretch}
.now-pic{flex:0 0 auto;width:216px;height:322px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.now-pic img{width:100%;height:100%;object-fit:cover;object-position:50% 7%;display:block}
.now-txt{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.now-k{font-size:12px;color:var(--dim)}
.now-v{font-size:24px;font-weight:500;line-height:1.3}
.now-d{font-size:13px;color:var(--text-2);line-height:1.7}
.now-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
@media (max-width:760px){.now-wrap{flex-direction:column}.now-pic{width:100%;height:240px}}
</style></head>
<body>
<header><b>情绪</b><span class="tag" id="mode">读不到</span><span class="st" id="stamp">—</span></header>
<main>
  <section class="card wide"><div class="now-wrap">
    <div class="now-pic" id="mood-pic"><img id="mood-img" src="assets/char/mascot.webp" alt="大肥鱼此刻的样子"></div>
    <div class="now-txt">
      <div class="now-k">她此刻的样子</div>
      <div class="now-v" id="mood-name">—</div>
      <div class="now-d" id="mood-desc">正在读取情绪状态。</div>
      <div class="now-tags" id="mood-tags"></div>
    </div>
  </div></section>
  <section class="card"><h2>九根基本情绪</h2><canvas id="radar"></canvas></section>
  <section class="card">
    <h2>慢变量与组合</h2>
    <div class="rows" id="vars"></div>
    <div class="axis"><div class="track"></div><div class="mk" id="mk"></div>
      <span class="lb l">冷淡</span><span class="lb c">平静</span><span class="lb r">黏人</span></div>
  </section>
  <section class="card"><h2>组合情绪（只决定语气，不点名）</h2><div class="rows" id="comp"></div></section>
  <section class="card"><h2>此刻的说法</h2><pre id="tone">—</pre></section>
  <section class="card wide"><h2>承诺账</h2><div id="promises"></div></section>
  <section class="card wide"><h2>边界账</h2><div id="bounds"></div></section>
</main>
<script>
var EMBED=/[?&]embed=1/.test(location.search);
if(EMBED)document.body.classList.add("embed");
function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");}
try{applyTheme(localStorage.getItem("dfy-theme")||"light");}catch(e){}
window.addEventListener("storage",function(ev){if(ev.key==="dfy-theme"&&ev.newValue)applyTheme(ev.newValue);});
const DIMS=[["curious","好奇"],["joy","开心"],["worry","担心"],["sad","难过"],["gloom","闷"],["tired","累"],["jealous","吃醋"],["anger","生气"],["surprise","惊讶"]];
const $=s=>document.querySelector(s);
const MOOD_FOR={curious:"confused",joy:"cheerful",worry:"frightened",sad:"shy",gloom:"exasperated",tired:"serious",jealous:"exasperated",anger:"angry",surprise:"starry"};
const MOOD_TEXT={
  angry:["有点生气","尾巴拍着地板，说话短了一截。"],
  cheerful:["很开心","摇着尾巴，愿意多说两句。"],
  confused:["在琢磨","托着腮想你刚说的那件事，还没想明白。"],
  exasperated:["有点无奈","抱着手臂，不太想接这个话。"],
  frightened:["有点担心","耳朵垂下来了，怕你那边出事。"],
  serious:["很认真","竖起一根手指，准备把话讲清楚。"],
  shy:["害羞","低着头，脸红，不太敢看你。"],
  starry:["眼睛发亮","对这件事有兴趣，想听你接着说。"]
};
const CALM=["平静","没什么波澜，就是平常的样子。"];
document.getElementById("mood-img").addEventListener("error",function(){
  const p=document.getElementById("mood-pic");
  if(p){p.style.display="none";}
});
function renderMood(dims){
  const d=dims||{};
  let best="",bv=-1;
  for(const x of DIMS){const v=+d[x[0]]||0;if(v>bv){bv=v;best=x[0];}}
  let file,key;
  if(bv<25){file="mascot.webp";key=null;}
  else{key=MOOD_FOR[best]||"cheerful";file="mood/"+key+".webp";}
  const txt=key?MOOD_TEXT[key]:CALM;
  const img=$("#mood-img"),src="assets/char/"+file;
  if(img.getAttribute("src")!==src)img.setAttribute("src",src);
  $("#mood-name").textContent=txt[0];
  $("#mood-desc").textContent=txt[1];
  const tags=$("#mood-tags");tags.innerHTML="";
  DIMS.filter(x=>typeof d[x[0]]==="number").sort((a,b)=>d[b[0]]-d[a[0]]).slice(0,3)
    .forEach(x=>{const s=document.createElement("span");s.className="tag";
      s.textContent=x[1]+" "+(+d[x[0]]).toFixed(0);tags.appendChild(s);});
}
function row(label,val,cls){const d=document.createElement("div");d.className="row";
 d.innerHTML='<span>'+label+'</span><span class="bar '+(cls||'')+'"><i style="width:'+Math.max(0,Math.min(100,val))+'%"></i></span><span class="num">'+(+val).toFixed(1)+'</span>';return d;}
function draw(dims){
  const cs=getComputedStyle(document.documentElement),V=k=>cs.getPropertyValue(k).trim();
  const C={line:V("--line")||"#eef1f5",axis:V("--line-2")||"#f1f3f7",dim:V("--dim")||"#68717f",brand:V("--brand")||"#3d5aa8"};
  const cv=$("#radar"),dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=300;cv.width=w*dpr;cv.height=h*dpr;
  const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2+6,R=Math.min(w,h)/2-42,n=DIMS.length;
  for(let g=1;g<=4;g++){c.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*g/4;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();
    c.strokeStyle=C.line;c.lineWidth=1;c.stroke();}
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;
    c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);c.strokeStyle=C.axis;c.stroke();
    c.fillStyle=C.dim;c.font="12px Microsoft YaHei";c.textAlign="center";c.textBaseline="middle";
    const lx=cx+Math.cos(a)*(R+22),ly=cy+Math.sin(a)*(R+16);
    c.fillText(DIMS[i][1]+" "+(+dims[DIMS[i][0]]||0).toFixed(0),lx,ly);}
  c.beginPath();
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,r=R*Math.max(0,Math.min(100,dims[DIMS[i][0]]||0))/100;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();c.fillStyle=C.brand;c.globalAlpha=.16;c.fill();c.globalAlpha=1;c.strokeStyle=C.brand;c.lineWidth=2;c.stroke();
}
function table(rows,cols,emptyTxt){
  if(!rows||!rows.length)return '<div class="empty">'+emptyTxt+'</div>';
  let s='<table><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';
  for(const r of rows){s+='<tr>'+cols.map(c=>'<td>'+c[1](r)+'</td>').join('')+'</tr>';}
  return s+'</table>';
}
async function tick(){
  try{
    const r=await fetch("/api/console/emotion",{cache:"no-store"});const d=await r.json();
    $("#mode").textContent=d.enabled?"在跑":"关着";
    $("#stamp").textContent=new Date().toLocaleTimeString();
    draw(d.dims||{});
    renderMood(d.dims||{});
    const v=$("#vars");v.innerHTML="";
    v.appendChild(row("信任",d.trust||0,"g"));
    v.appendChild(row("账压",Math.min(100,(d.debt||0)*8),"a"));
    v.appendChild(row("生气",(d.dims||{}).anger||0,"r"));
    v.appendChild(row("黏人度",((d.intimacy||0)+1)*50,""));
    $("#mk").style.left=(((d.intimacy||0)+1)*50)+"%";
    const cp=$("#comp");cp.innerHTML="";
    const names={"嫉妒":"吃醋+难过","心疼":"担心+难过","委屈":"难过+生气","甜":"信任+开心"};
    for(const k in names){cp.appendChild(row(k,(d.composites||{})[k]||0,""));}
    $("#tone").textContent=d.block||"—";
    $("#promises").innerHTML=table(d.promises,[["内容",r=>r.text||"—"],["逾期",r=>r.overdue_days?(r.overdue_days+" 天"):"未到期"],["id",r=>'<span class="num">'+(r.id||"")+'</span>']],"账上干净，没有欠着的事。");
    $("#bounds").innerHTML=table(d.boundaries,[["类型",r=>r.kind==="passive"?"被动（碰红线）":"主动（说了不还坚持）"],["说明",r=>r.note||"—"],["时间",r=>r.ts?new Date(r.ts*1000).toLocaleString():"—"]],"没有越界记录。");
  }catch(e){$("#stamp").textContent="连不上 proxy："+e.message;}
}
tick();setInterval(tick,5000);
window.addEventListener("resize",()=>{if(window.__d)draw(window.__d);});
</script>
</body></html>

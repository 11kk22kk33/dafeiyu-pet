<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 宠物 · 安装向导</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#1d2530; --sub:#5d6b7d;
    --line:#e3e8f0; --pri:#3d5aa8; --pri-d:#33509b; --ok:#12a06a; --warn:#c9820a; --bad:#d24040;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 64px}
  .hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .hd-av{width:64px;height:64px;flex:0 0 auto;display:block}
  header h1{font-size:22px;margin:0 0 4px}
  header .sub{color:var(--sub);font-size:13px;margin-bottom:16px}
  .hd .sub{margin:2px 0 0}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:20%;background:var(--pri);transition:width .25s ease}
  .dots{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
  .dot{flex:1 1 0;min-width:96px;padding:7px 10px;border-radius:10px;background:#eef2f9;
    color:var(--sub);font-size:12px;text-align:center;border:1px solid transparent}
  .dot.on{background:#e7efff;color:var(--pri-d);border-color:#c7dbff;font-weight:600}
  .dot.done{background:#e8f7f0;color:#0d8055;border-color:#c6ebda}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:26px 24px;margin-top:18px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
  .card h2{font-size:19px;margin:0 0 6px}
  .lead{color:var(--sub);margin:0 0 18px}
  .big{display:block;width:100%;padding:15px 18px;margin:10px 0;border-radius:12px;
    border:1px solid var(--pri);background:var(--pri);color:#fff;font-size:16px;
    font-weight:600;cursor:pointer;text-align:center}
  .big:hover{background:var(--pri-d)}
  .big.ghost{background:#fff;color:var(--pri-d);border-color:#c7dbff}
  .big.ghost:hover{background:#f2f6ff}
  .big:disabled{opacity:.55;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
  .row .big{flex:1 1 210px;width:auto}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
  input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:14px;background:#fbfcfe;color:var(--ink)}
  input[type=text]:focus,input[type=password]:focus{outline:2px solid #cfe0ff;border-color:#9dc0ff}
  .pk{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:12px}
  @media(max-width:640px){.pk{grid-template-columns:1fr}}
  .pk .item{min-width:0}
  .pk .item b{font-size:12px;font-weight:600;color:#2a3546;display:block}
  .pk .item span{font-size:11px;color:#8a97a8}
  .pk input{margin-top:4px;font-size:12px;padding:8px 9px}
  .pk .item.miss input{border-color:#f0c98a;background:#fffaf0}
  .list{margin:12px 0 0;border-top:1px solid var(--line)}
  .list .li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;
    border-bottom:1px solid var(--line);font-size:13px}
  .list .li em{font-style:normal;color:var(--sub);word-break:break-all;margin-right:12px}
  .tag{font-size:12px;padding:1px 8px;border-radius:99px;white-space:nowrap}
  .tag.ok{background:#e8f7f0;color:#0d8055}
  .tag.no{background:#fdeeee;color:#b33030}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;display:none}
  .msg.show{display:block}
  .msg.ok{background:#e8f7f0;color:#0d6f4a;border:1px solid #c6ebda}
  .msg.err{background:#fdeeee;color:#a92f2f;border:1px solid #f4cfcf}
  .msg.info{background:#eef4ff;color:#2b4f96;border:1px solid #d5e2ff}
  textarea{width:100%;min-height:130px;padding:11px;border:1px solid var(--line);
    border-radius:10px;font:12px/1.6 Consolas,monospace;background:#fbfcfe;color:#26313f}
  .links a{display:inline-block;margin:8px 14px 0 0;color:var(--pri-d);font-size:14px}
  .note{margin-top:16px;font-size:12px;color:#8a97a8;line-height:1.7}
  .nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px}
  .nav button{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;
    color:var(--sub);cursor:pointer;font-size:13px}
  .nav button:hover{border-color:#c7dbff;color:var(--pri-d)}
  .big-ok{font-size:26px;font-weight:700;color:var(--ok);text-align:center;margin:8px 0 4px}
  .chk{background:#f7fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
  .chk div{font-size:14px;padding:5px 0}
  footer{margin-top:26px;font-size:12px;color:#98a4b4;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <img class="hd-av" src="assets/char/mascot.webp" alt="" onerror="this.style.display='none'">
      <div>
        <h1>AI 宠物 · 安装向导</h1>
        <div class="sub">跟着点，一步一步来。装完大概 10 分钟，只有登录 QQ 那步要你自己动手。</div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="bar"><i id="barfill"></i></div>
  </header>
  <main id="app" class="card"></main>
  <footer>本向导只改 config-paths.json 和 key.txt 两个文件，不动源码。</footer>
</div>
<script>
(function(){
  "use strict";
  var API = "http://127.0.0.1:8787";
  var STEP_KEY = "dfy-setup-step";
  var REPO_URL_TODO = "";
  var S = { step: 1, src: "", probe: null, paths: null, saved: "", msgType: "info", msg: "" };

  var LABEL = {
    qq_exe: ["QQ 主程序", "QQ.exe"],
    snow_dir: ["SnowLuma 目录", "协议层所在文件夹"],
    snow_config: ["SnowLuma 配置", "一般叫 napcat.json"],
    astrbot_app: ["AstrBot 目录", "AstrBot 主文件夹"],
    astrbot_py: ["AstrBot 的 python.exe", "别填系统 Python"],
    astrbot_bin: ["AstrBot 启动器", "bat 或 exe"],
    astrbot_cmd_config: ["AstrBot 配置", "data/cmd_config.json"],
    pet_exe: ["桌面宠物主程序", "桌宠本体"],
    pet_shared: ["共享目录", "宠物和网关交换文件用"],
    fish_dir: ["鱼搭子目录", "桌面挂件"],
    fish_exe: ["鱼搭子主程序", "挂件启动 exe"],
    bili_plugin: ["B 站插件目录", "AstrBot 插件"],
    bili_data: ["B 站数据目录", "日志/缓存"],
    story_dir: ["故事目录", "睡前故事素材"],
    ffprobe: ["ffprobe", "视频抽帧用"],
    dsh_cmd: ["DSH 命令行", "可留空"],
    dsh_workdir: ["DSH 工作目录", "可留空"]
  };
  var STEP3_KEYS = ["qq_exe","snow_dir","snow_config","astrbot_py","astrbot_app",
                    "astrbot_bin","astrbot_cmd_config","pet_exe","pet_shared",
                    "fish_dir","fish_exe","bili_plugin","bili_data","story_dir","ffprobe",
                    "dsh_cmd","dsh_workdir"];
  var PROBE_KEYS = ["qq_exe","snow_dir","snow_config","astrbot_py","astrbot_app"];

  function $(id){ return document.getElementById(id); }
  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"]/g, function(c){
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function labelOf(k){
    var L = LABEL[k];
    return L ? L[0] : k;
  }
  function hintOf(k){
    var L = LABEL[k];
    return L ? L[1] : "";
  }

  function http(method, path, body){
    var opt = { method: method, headers: {}, cache: "no-store" };
    if (body !== null && body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = null;
    if (ctl) {
      opt.signal = ctl.signal;
      timer = setTimeout(function(){ try { ctl.abort(); } catch (e) {} }, 20000);
    }
    return fetch(API + path, opt).then(function(r){
      return r.text().then(function(t){
        var j = null;
        try { j = JSON.parse(t); } catch (e) { j = null; }
        if (timer) clearTimeout(timer);
        if (!r.ok) {
          return { ok: false, error: (j && j.error) ? j.error : ("后端返回 " + r.status + "，请重启程序再试") };
        }
        if (!j) return { ok: false, error: "后端返回的内容看不懂（不是 JSON）" };
        return j;
      });
    }).catch(function(){
      if (timer) clearTimeout(timer);
      return { ok: false, error: "连不上程序（127.0.0.1:8787）——程序还没启动。先在源码目录双击 启动.bat（没有这个文件就在命令行里执行 python proxy.py），等浏览器能打开 http://127.0.0.1:8787/console，再回来点一次。" };
    });
  }

  function note(type, text){
    S.msgType = type; S.msg = text;
    var box = $("msg");
    if (!box) return;
    box.className = "msg show " + type;
    box.textContent = text;
  }
  function msgBox(){
    if (!S.msg) return '<div class="msg" id="msg"></div>';
    return '<div class="msg show ' + esc(S.msgType) + '" id="msg">' + esc(S.msg) + "</div>";
  }

  function go(n){
    if (n < 1) n = 1;
    if (n > 5) n = 5;
    S.step = n;
    S.msg = "";
    try { localStorage.setItem(STEP_KEY, String(n)); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  function nav(){
    return '<div class="nav"><button type="button" onclick="go(' + (S.step - 1) + ')">' +
      (S.step === 1 ? "　" : "← 上一步") + '</button><button type="button" onclick="go(' +
      (S.step + 1) + ')">下一步 →</button></div>';
  }

  function step1(){
    return '<h2>第一步：把程序装到 D 盘</h2>' +
      '<p class="lead">源码放 D 盘根目录、路径别带中文和空格，后面能少踩一半的坑。</p>' +
      '<button class="big" type="button" disabled style="opacity:.45;cursor:not-allowed">从 GitHub 下载（暂未开放）</button>' +
      '<button class="big ghost" type="button" onclick="focusDir()">我已经有源码，选择目录</button>' +
      '<label for="src">源码目录（在资源管理器地址栏复制路径，粘到这里）</label>' +
      '<input type="text" id="src" placeholder="例如 D:\pet-src" value="' + esc(S.src) + '">' +
      '<div class="row"><button class="big" type="button" onclick="saveSrc()">确认源码位置</button></div>' +
      msgBox() +
      '<div class="note">GitHub 仓库还在整理，按钮暂时点不了。点下面「我已经有源码，选择目录」，把刚解压的文件夹路径粘进来就行——这一步只是记个位置，不影响后面。</div>' +
      nav();
  }

  function step2(){
    var rows = "";
    if (S.probe) {
      for (var i = 0; i < PROBE_KEYS.length; i++) {
        var k = PROBE_KEYS[i], it = S.probe[k] || {};
        rows += '<div class="li"><em>' + esc(labelOf(k)) + "：" + esc(it.path || it.value || "") +
          '</em><span class="tag ' + (it.found ? "ok" : "no") + '">' +
          (it.found ? "已找到" : "未找到") + "</span></div>";
      }
      rows = '<div class="list">' + rows + "</div>";
    }
    return '<h2>第二步：安装 QQ 和协议层</h2>' +
      '<p class="lead">这一步需要你自己装两个软件，我负责检查装好没有。</p>' +
      '<div class="links">' +
      '<a href="https://im.qq.com/pcqq/" target="_blank" rel="noreferrer">① 下载 QQ 客户端</a>' +
      '<a href="https://github.com/NapNeko/NapCatQQ-Desktop" target="_blank" rel="noreferrer">② 下载协议层（SnowLuma / NapCat 类）</a>' +
      "</div>" +
      '<div class="row"><button class="big" type="button" onclick="check2()">我装好了，检查</button></div>' +
      rows + msgBox() +
      '<div class="note">SnowLuma 有非商业许可，请自己下载安装，我不会替你装，也不随包分发。' +
      "检查用的是程序里的探测接口，只读路径，不改任何东西。</div>" +
      nav();
  }

  function step3(){
    var src = S.paths || {};
    var items = "";
    for (var i = 0; i < STEP3_KEYS.length; i++) {
      var k = STEP3_KEYS[i];
      var v = src[k] == null ? "" : String(src[k]);
      var miss = v ? "" : " miss";
      items += '<div class="item' + miss + '"><b>' + esc(labelOf(k)) +
        '</b><span>' + esc(k) + " · " + esc(hintOf(k)) + '</span>' +
        '<input type="text" data-k="' + esc(k) + '" value="' + esc(v) + '"></div>';
    }
    return '<h2>第三步：自动配路径</h2>' +
      '<p class="lead">程序要去哪找 QQ、AstrBot、SnowLuma，都在这一页填。黄色的没找到，手动补一下就行。</p>' +
      '<div class="row">' +
      '<button class="big" type="button" onclick="autoFill()">自动探测并填好</button>' +
      '<button class="big ghost" type="button" onclick="savePaths()">保存路径</button></div>' +
      '<div class="pk">' + items + "</div>" + msgBox() +
      '<div class="note">只有 AstrBot / QQ / SnowLuma 这些外部程序要填；程序自己的文件不用管。' +
      "保存后会写进 config-paths.json，重启程序才生效。</div>" +
      nav();
  }

  function step4(){
    return '<h2>第四步：登录 QQ</h2>' +
      '<p class="lead" style="font-size:16px;color:#1d2530">这一步必须你自己来——二维码是 QQ 弹的，我生成不了。</p>' +
      '<button class="big" type="button" onclick="openQQ()">打开 QQ</button>' +
      '<div class="row"><button class="big ghost" type="button" onclick="check4()">我登录好了，继续</button></div>' +
      msgBox() +
      '<div class="note">请在 QQ 窗口里扫码登录；登录完成后点上面第二个按钮，我读一下状态。' +
      "这一步不会自动扫码、不会自动点确认，做不到就不假装做到。</div>" +
      nav();
  }

  function step5(){
    return '<h2>第五步：填 key 并完成</h2>' +
      '<p class="lead">模型 key 只写进 key.txt 这一处，不进配置文件、不进日志。</p>' +
      '<label for="key">把你的模型 key 粘这里</label>' +
      '<input type="password" id="key" placeholder="百炼 sk-ws- 开头 / DeepSeek sk- 开头" autocomplete="off">' +
      '<div class="row"><button class="big" type="button" onclick="finish()">保存并启动</button></div>' +
      msgBox() +
      '<div class="note">保存后顺手启动整条链。启动要几十秒，控制台能打开就算成功。</div>' +
      nav();
  }

  function donePage(){
    var here = window.location.href;
    var bat = "@echo off\r\nstart \"\" \"" + API + "/console\"\r\n";
    return '<h2 class="big-ok">装好了！</h2>' +
      '<p class="lead" style="text-align:center">下面三条都能过，就说明这套真的跑起来了。</p>' +
      '<div class="chk">' +
      "<div>1. 浏览器打开 " + API + "/health 返回 200</div>" +
      "<div>2. QQ 私聊发一句「在吗」，三秒内有回复</div>" +
      "<div>3. 控制台 " + API + "/console 能打开、状态不是灰色</div>" +
      "</div>" +
      '<div class="row"><button class="big" type="button" onclick="openConsole()">打开控制台</button></div>' +
      '<label>桌面快捷方式（浏览器里建不了，把下面这段存成 打开控制台.bat 双击即可）</label>' +
      '<textarea id="bat" readonly>' + esc(bat) + "</textarea>" +
      '<div class="row"><button class="big ghost" type="button" onclick="copyBat()">复制这段文字</button></div>' +
      msgBox() +
      '<div class="note">向导进度存在本机浏览器里，刷新不会丢；全部做完可以关掉这个页面。</div>' +
      '<div class="nav"><button type="button" onclick="go(5)">← 上一步</button><button type="button" onclick="reset()">重新走一遍</button></div>';
  }

  function render(){
    var names = ["获取源码", "装 QQ 与协议层", "配路径", "登录 QQ", "填 key"];
    var dots = "";
    for (var i = 0; i < names.length; i++) {
      var n = i + 1;
      var cls = S.step === n ? " on" : (S.step > n ? " done" : "");
      dots += '<div class="dot' + cls + '">' + n + " · " + names[i] + "</div>";
    }
    $("dots").innerHTML = dots;
    $("barfill").style.width = Math.round((S.step / 5) * 100) + "%";
    var body = [step1, step2, step3, step4, step5][S.step - 1]();
    if (S.step === 6) body = donePage();
    $("app").innerHTML = body;
  }

  function dlRepo(){
    note("info", "GitHub 仓库还没建好（地址待填）。现在请点第二个按钮，把本地源码目录粘进来。");
  }
  function focusDir(){ var e = $("src"); if (e) { e.focus(); e.select(); } }
  function saveSrc(){
    var v = ($("src") ? $("src").value : "").replace(/^\s+|\s+$/g, "");
    if (!v) { note("err", "还没填目录。先在资源管理器里进到源码文件夹，复制地址栏里的路径。"); return; }
    S.src = v;
    note("ok", "源码位置：" + v + " ✓");
  }
  function extractProbe(j){
    // 后端 probe 返回 {ok:true, probe:{key:{path,found}}}；这里兼容两种形态
    if (!j || !j.ok) return null;
    if (j.probe) return j.probe;
    if (j.paths) return j.paths;
    return j;
  }
  function check2(){
    note("info", "正在检查，请稍等…");
    http("GET", "/api/console/probe", null).then(function(j){
      var p = extractProbe(j);
      if (!p) { S.probe = null; note("err", (j && j.error) || "探测失败，先确认程序已启动"); render(); return; }
      S.probe = p;
      var hit = 0, keys = Object.keys(p);
      for (var i = 0; i < keys.length; i++) { if (p[keys[i]] && p[keys[i]].found) hit++; }
      note(hit ? "ok" : "err", hit ? ("探测完成：找到 " + hit + " 项") : "一个都没找到，确认软件装好了、路径选对了吗");
      render();
    });
  }
  function autoFill(){
    if (S.probe) { fillFrom(S.probe); return; }
    note("info", "正在探测…");
    http("GET", "/api/console/probe", null).then(function(j){
      var p = extractProbe(j);
      if (!p) { note("err", (j && j.error) || "探测失败"); return; }
      S.probe = p;
      fillFrom(p);
    });
  }
  function fillFrom(p){
    var boxes = document.querySelectorAll("input[data-k]");
    var filled = 0;
    for (var i = 0; i < boxes.length; i++) {
      var k = boxes[i].getAttribute("data-k");
      var it = p[k];
      var v = it ? (it.path || it.value || "") : "";
      if (v) { boxes[i].value = v; filled++; boxes[i].parentNode.className = "item"; }
    }
    note(filled ? "ok" : "err", filled ? ("已自动填好 " + filled + " 项，剩下的手动补") : "没探测到可填的路径，请手动填");
  }
  function savePaths(){
    var boxes = document.querySelectorAll("input[data-k]");
    var out = {};
    for (var i = 0; i < boxes.length; i++) {
      var k = boxes[i].getAttribute("data-k");
      if (k === "_说明") continue;
      out[k] = (boxes[i].value || "").replace(/^\s+|\s+$/g, "");
    }
    note("info", "保存中…");
    http("POST", "/api/console/paths", { paths: out }).then(function(j){
      if (!j || !j.ok) { note("err", (j && j.error) || "保存失败"); return; }
      S.paths = j.paths || out;
      var ch = j.changed || [];
      note("ok", "已保存。改动 " + ch.length + " 项" + (ch.length ? "：" + ch.join("、") : "（没有变化）"));
      render();
    });
  }
  function openQQ(){
    note("info", "正在启动…");
    http("POST", "/api/console/launch", { what: "brain", on: true }).then(function(j){
      if (!j || !j.ok) { note("err", (j && j.error) || "启动失败"); return; }
      note(j.started ? "ok" : "info", j.started ? "进程已拉起，看 QQ 窗口有没有弹出来" : "程序说没起来，先看看 QQ 是不是得手动双击");
    });
  }
  function check4(){
    note("info", "读状态中…");
    http("GET", "/api/console/state", null).then(function(j){
      if (!j || !j.ok) { note("err", (j && j.error) || "读不到状态"); return; }
      var q = j.qq || {};
      var acct = q.account || {};
      var name = acct.nick || acct.name || acct.uin || "";
      if (q.ws || name) { note("ok", "检测到登录 ✓" + (name ? "：" + name : "")); }
      else { note("err", "还没检测到，再等等——协议层连上要十几秒。"); }
    });
  }
  function finish(){
    var v = ($("key") ? $("key").value : "").replace(/^\s+|\s+$/g, "");
    if (!v) { note("err", "key 还没填。去模型控制台复制一条，sk- 开头那串。"); return; }
    note("info", "保存 key…");
    http("POST", "/api/console/key", { key: v }).then(function(j){
      if (!j || !j.ok) { note("err", (j && j.error) || "key 保存失败"); return; }
      note("info", "key 已保存，正在启动…");
      http("POST", "/api/console/launch", { what: "brain", on: true }).then(function(j2){
        S.step = 6;
        try { localStorage.setItem(STEP_KEY, "6"); } catch (e) {}
        render();
      });
    });
  }
  function openConsole(){ window.open(API + "/console", "_blank"); }
  function copyBat(){
    var t = $("bat");
    if (!t) return;
    t.select();
    var okc = false;
    try { okc = document.execCommand("copy"); } catch (e) { okc = false; }
    note(okc ? "ok" : "info", okc ? "已复制，存成 打开控制台.bat 就行" : "复制没成功，手动全选复制这段文字");
  }
  function reset(){
    try { localStorage.removeItem(STEP_KEY); } catch (e) {}
    S = { step: 1, src: "", probe: null, paths: null, saved: "", msgType: "info", msg: "" };
    render();
  }

  window.go = go; window.dlRepo = dlRepo; window.focusDir = focusDir; window.saveSrc = saveSrc;
  window.check2 = check2; window.autoFill = autoFill; window.savePaths = savePaths;
  window.openQQ = openQQ; window.check4 = check4; window.finish = finish;
  window.openConsole = openConsole; window.copyBat = copyBat; window.reset = reset;

  try {
    var saved = 1;
    try { saved = parseInt(localStorage.getItem(STEP_KEY) || "1", 10) || 1; } catch (e) { saved = 1; }
    S.step = saved >= 1 && saved <= 6 ? saved : 1;
    render();
    if (window.location.protocol === "file:") {
      setTimeout(function(){ note("info", "当前是以文件方式打开的。接口已允许跨源；若提示连不上，先启动程序再点一次。"); }, 300);
    }
  } catch (err) {
    document.getElementById("app").innerHTML =
      '<h2>页面出错了</h2><p class="lead">' + esc(err && err.message ? err.message : String(err)) +
      "</p><p class='note'>把这段报错发给我就行，不影响已经装好的东西。</p>";
  }
})();
</script>
</body>
</html>
